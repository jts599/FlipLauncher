<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlipLauncher Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&family=Press+Start+2P&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="prototype-shell">
    <section class="phone" aria-label="Retro phone prototype">
      <div class="speaker-slot" aria-hidden="true"></div>
      <div class="phone-body">
        <section class="screen" aria-label="Monochrome display">
          <div class="screen-bezel">
            <div class="screen-surface">
              <div class="screen-content" aria-label="Home screen status">
                <div class="status-layout">
                  <div class="time-panel">
                    <span class="time-display">8:11</span>
                    <span class="battery-display">BAT 87%</span>
                  </div>

                  <div class="weather-panel">
                    <div class="weather-current">
                      <span class="weather-icon" aria-hidden="true">☀</span>
                      <strong class="weather-temp">84°</strong>
                    </div>
                    <span class="weather-range">H:88° L:72°</span>
                  </div>
                </div>
              </div>

              <div class="screen-actions" aria-hidden="true">
                <span>⌕</span>
                <span>▤</span>
                <span>⚙</span>
              </div>
            </div>
          </div>
        </section>

        <section class="action-buttons" aria-label="Action buttons">
          <button type="button" class="action-bar action-bar-1" aria-label="Action 1"></button>
          <button type="button" class="action-bar action-bar-2" aria-label="Action 2"></button>
          <button type="button" class="action-bar action-bar-3" aria-label="Action 3"></button>
        </section>

        <section class="keypad" aria-label="Phone keypad">
          <div class="keypad-grid">
            <button type="button">1</button>
            <button type="button">2<span>ABC</span></button>
            <button type="button">3<span>DEF</span></button>
            <button type="button">4<span>GHI</span></button>
            <button type="button">5<span>JKL</span></button>
            <button type="button">6<span>MNO</span></button>
            <button type="button">7<span>PQRS</span></button>
            <button type="button">8<span>TUV</span></button>
            <button type="button">9<span>WXYZ</span></button>
            <button type="button">*</button>
            <button type="button">0<span>+</span></button>
            <button type="button">#</button>
          </div>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
